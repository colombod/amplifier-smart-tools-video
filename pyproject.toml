[project]
name = "vid"
version = "0.1.0"
description = "Edit and curate video: trim, retime, zoom, stitch, caption, and find moments by what was said or shown. Chainable \u2014 every verb passes an edit plan, and one render compiles it to a single ffmpeg pass"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "github-copilot-sdk>=1.0.13,<2.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.2,<0.28.0",
]

[project.urls]
Repository = "https://github.com/colombod/amplifier-smart-tools-video"

[project.scripts]
vid = "vid.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vid"

[tool.uv]
add-bounds = "major"
default-groups = "all"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
