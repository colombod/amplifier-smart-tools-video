[project]
name = "vid"
version = "0.3.2"
description = "Edit and curate video: trim, retime, zoom, stitch, caption, and find moments by what was said or shown. Chainable \u2014 every verb passes an edit plan, and one render compiles it to a single ffmpeg pass"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "github-copilot-sdk>=1.0.13,<2.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "pydantic>=2.13,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.2,<0.28.0",
]

[project.optional-dependencies]
# The speech backend, as an EXTRA rather than a follow-up install. This tool is
# installed with `uv tool install`, which gives it an isolated environment -- so
# there is no `pip install` a caller could usefully run afterwards, and telling
# them to would be wrong. A tier a caller cannot reach in one command is a tier
# they will not reach:
#
#   uv tool install 'vid[speech] @ git+https://github.com/colombod/amplifier-smart-tools-video'
#
# faster-whisper and not whisper.cpp, and not because it transcribes better --
# whisper.cpp with Metal is faster on a Mac. Because it is the only one an agent
# can install unattended and expect to succeed: no compiler, no platform branch,
# no separate step, idempotent model download, works CPU-only in a container.
speech = [
    "faster-whisper>=1.0,<2.0",
]

# Text-to-speech, for `narrate`. piper-tts and not a cloud TTS, because
# narration is a capability people would reach for constantly and paying a
# credential tax for it would quietly undo the point of the deterministic tiers.
#
# Verified in a clean container BEFORE this was committed to: a 32.6 MiB
# prebuilt wheel, no compiler, and ZERO version changes to anything already
# installed -- piper declares `onnxruntime<2,>=1` with no numpy pin, and parks
# torch, cython and cmake behind a `train` extra a plain install never touches.
# It rides alongside faster-whisper's onnxruntime rather than fighting it, and
# both were run in one process to prove it.
voice = [
    "piper-tts>=1.8,<2.0",
]

# Everything. For a caller who would rather install once than discover a missing
# tier mid-task.
all = [
    "faster-whisper>=1.0,<2.0",
    "piper-tts>=1.8,<2.0",
]

[project.urls]
Repository = "https://github.com/colombod/amplifier-smart-tools-video"

[project.scripts]
vid = "vid.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vid"

[tool.uv]
add-bounds = "major"
default-groups = "all"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ty flags two of Typer's own idioms in cli.py as errors, not bugs:
#
# - invalid-type-form: `_doc(name)` (a function call) used in parameter-
#   annotation position. Each verb's `--help` needs its own callback bound to
#   that verb's name, so `_doc` is a factory returning a distinct
#   `Annotated[bool, typer.Option(...)]` per call. Making it a static,
#   call-free alias was evaluated and rejected: a single shared callback would
#   need to recover its verb name from the click `Context`, which means a
#   hand-maintained path -> name table for the `audio` sub-app (its click
#   command names, e.g. "remove", don't match their verb-doc keys, e.g.
#   "audio_remove") and a changed signature on every callback -- real
#   behaviour risk to a documented surface with its own drift tests
#   (tests/test_help_drift.py), spent satisfying a type checker rather than
#   fixing an actual defect.
# - invalid-parameter-default: Typer's own spelling for a REQUIRED option is
#   `Annotated[str, typer.Option(...)] = ...`. The `...` (Ellipsis) sentinel
#   is recognised by Typer/Click at runtime and is never actually handed to
#   the function; ty does not know that convention and sees a plain
#   `EllipsisType` default against a `str` annotation.
#
# Both are Typer conventions used by every verb in this file. Suppressed here,
# scoped to this one file, rather than fixed, because there is nothing wrong
# to fix.
[[tool.ty.overrides]]
include = ["src/vid/cli.py"]

[tool.ty.overrides.rules]
invalid-type-form = "ignore"
invalid-parameter-default = "ignore"
